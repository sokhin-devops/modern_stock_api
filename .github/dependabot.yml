# Weekly update pull requests into dev (doc/plain/DevSecOps.md section 7). Security fixes come as soon as they're out;
# other new versions wait 7 days (cooldown), since a hijacked release is usually caught within days.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: org.springframework.boot:spring-boot-starter-parent
        update-types: ["version-update:semver-major"]
      # The AWS SDK releases every day: take its minor updates, not each patch
      - dependency-name: software.amazon.awssdk:*
        update-types: ["version-update:semver-patch"]
  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
