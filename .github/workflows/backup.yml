# Weekly encrypted backup of the prod database (doc/plain/DevSecOps.md section 9).
# Supabase free has no backups you can download. The restore steps are in the same section.
# It only runs while this repo is private: on a public repo anyone signed in to GitHub can download run artifacts.
name: Database backup

on:
  schedule:
    - cron: '0 20 * * 6' # Sunday 03:00 Phnom Penh time
  workflow_dispatch:

permissions:
  contents: read

env:
  POSTGRES: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Only while the repo is private
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          echo "private=$private" >> "$GITHUB_OUTPUT"
          if [ "$private" != true ]; then
            echo "::notice::The repo is public, so no backup: anyone could download the artifact"
          fi

      - name: Dump and encrypt
        if: steps.guard.outputs.private == 'true'
        env:
          DB_URL: ${{ secrets.PROD_BACKUP_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          file="modern_stock-$(date -u +%Y-%m-%d).dump"
          docker run --rm -e DB_URL "$POSTGRES" \
            sh -c 'pg_dump "$DB_URL" --schema=public --no-owner --no-privileges -Fc' > "$file"
          printf '%s' "$PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --symmetric --cipher-algo AES256 --output "$file.gpg" "$file"
          rm "$file"
          ls -l "$file.gpg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.guard.outputs.private == 'true'
        with:
          name: db-backup-${{ github.run_number }}
          path: '*.dump.gpg'
          retention-days: 30
          if-no-files-found: error
