# API pipeline (doc/plain/DevSecOps.md section 7).
# Every push and pull request: secret scan, code scan, build + tests, image + image scan.
# Pushes to dev and main also publish the image and deploy it: dev → dev-api.sokhin.site, main → api.sokhin.site.
name: API

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: docker.io/sokhin007/modern-stock-api
  # Scanners run from images pinned by version and digest: a moved tag can't swap the tool under us
  TRIVY: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  SEMGREP: semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0
  DEPLOY: ${{ github.event_name != 'pull_request' && (github.ref_name == 'main' || github.ref_name == 'dev') }}

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false

      - name: Secret scan (gitleaks)
        run: |
          v=8.30.1
          url=https://github.com/gitleaks/gitleaks/releases/download/v$v
          curl -sSfLO "$url/gitleaks_${v}_linux_x64.tar.gz"
          curl -sSfLO "$url/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt"
          tar -xzf "gitleaks_${v}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --redact --no-banner .

      - name: Code scan (Semgrep)
        run: docker run --rm -v "$PWD:/src" "$SEMGREP" semgrep scan --config p/java --config p/dockerfile --error --metrics off

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: sh ./mvnw -B -ntp verify

      - name: Build image
        run: docker build -t "$IMAGE:ci" .

      - name: Image scan and SBOM (Trivy)
        run: |
          trivy() { docker run --rm -v trivy-cache:/root/.cache -v "$PWD:/work" -w /work "$TRIVY" "$@"; }
          trivy config --severity HIGH,CRITICAL --exit-code 1 .
          # Scanned from a saved file: reading a JRE image through the Docker socket can pass Trivy's 5-minute limit.
          # No secret scanner here: gitleaks covers the repo, and .dockerignore lets only the jar into the image.
          docker save "$IMAGE:ci" -o image.tar
          trivy image --input image.tar --timeout 15m --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile .trivyignore.yaml # accepted findings, each with its reason and an expiry date
          trivy image --input image.tar --timeout 15m --format cyclonedx --output sbom.cdx.json
          rm image.tar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Publish image
        id: publish
        if: env.DEPLOY == 'true'
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::warning::No DOCKERHUB_TOKEN secret yet: the image was built and scanned, nothing was published"
            exit 0
          fi
          echo "$DOCKERHUB_TOKEN" | docker login -u sokhin007 --password-stdin
          tag="$GITHUB_REF_NAME-${GITHUB_SHA::7}"
          for t in "$tag" "$GITHUB_REF_NAME"; do
            docker tag "$IMAGE:ci" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Render
        if: env.DEPLOY == 'true'
        env:
          HOOK_PROD: ${{ secrets.RENDER_DEPLOY_HOOK_PROD }}
          HOOK_DEV: ${{ secrets.RENDER_DEPLOY_HOOK_DEV }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then hook=$HOOK_PROD; else hook=$HOOK_DEV; fi
          if [ -z "$DIGEST" ]; then
            echo "::warning::No image was published, so nothing was deployed"
            exit 0
          fi
          if [ -z "$hook" ]; then
            echo "::warning::No Render deploy hook for $GITHUB_REF_NAME yet: the image is on Docker Hub, nothing was deployed"
            exit 0
          fi
          # Deploy exactly the image that was scanned, by digest, not whatever the tag points to later
          curl -fsS -X POST "$hook&imgURL=$(jq -rn --arg v "$IMAGE@$DIGEST" '$v|@uri')" > /dev/null
          echo "Render is deploying $IMAGE@$DIGEST"
