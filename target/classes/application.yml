spring:
  application:
    name: modern_stock_api
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/modern_stock}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  servlet:
    multipart:
      # Pictures are at most 2 MB (FileStorage); a little room for the form around them.
      max-file-size: 3MB
      max-request-size: 3MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  messages:
    basename: i18n/messages
    fallback-to-system-locale: false
    # every message goes through MessageFormat, so ''-escaped apostrophes print right with or without arguments
    always-use-message-format: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
  error:
    include-message: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    display-request-duration: true
    doc-expansion: none
    filter: true
  default-produces-media-type: application/json

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # 32+ characters. Set JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-modern-stock-api-2026}
    access-token-minutes: 15
    refresh-token-days: 14
  web-app-url: ${WEB_APP_URL:http://localhost:4201}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:4201}
  # true only in development: responses include the verification/invitation/reset link so you can test without email
  dev-links: false
  demo-data: false
  billing:
    mode: demo
  telegram:
    # From @BotFather. Empty: Telegram is off (businesses can't connect, nothing is sent).
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    # The bot's @username without @, for the t.me links (asked from Telegram when empty).
    bot-username: ${TELEGRAM_BOT_USERNAME:}
    # Public HTTPS URL of /public/telegram/webhook; set = registered with Telegram at start.
    webhook-url: ${TELEGRAM_WEBHOOK_URL:}
    # Telegram sends it back in X-Telegram-Bot-Api-Secret-Token; webhook calls without it are refused.
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    # Development without a public URL: ask Telegram for new messages every 3 seconds instead of the webhook.
    polling: ${TELEGRAM_POLLING:false}
