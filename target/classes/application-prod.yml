app:
  jwt:
    secret: ${JWT_SECRET}
  dev-links: false
  demo-data: false

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

server:
  # Behind Nginx: the client's address comes from X-Forwarded-For, trusted only from internal proxies (rate limits)
  forward-headers-strategy: native
