        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageRow"
      security:
      - bearer: []
  /admin/businesses:
    get:
      tags:
