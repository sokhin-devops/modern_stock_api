      tags:
      - Branches
      summary: Deactivate a branch
      description: "Branches are never deleted. Not allowed for the main branch, or\
        \ while transfers to or from it are in transit."
      operationId: deactivateBranch
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /branches/{branchId}/warehouses/{id}:
    put:
      tags:
      - Branches
      summary: "Rename a warehouse, move its roles, or deactivate it"
      description: "A warehouse that sells, receives or still holds stock can't be\
        \ deactivated."
      operationId: updateWarehouse
      parameters:
      - name: branchId
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WarehouseRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WarehouseResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /units:
    get:
      tags:
      - Categories and units
      operationId: units
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnitResponse"
      security:
      - bearer: []
        business: []
        branch: []
    post:
      tags:
      - Categories and units
      operationId: createUnit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnitRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /transfers:
    get:
      tags:
      - Transfers
      summary: Transfers of the branches you see
      description: A transfer shows for both the sending and receiving branch.
      operationId: listTransfers
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DRAFT
          - MOVED
          - IN_TRANSIT
          - RECEIVED
          - RETURNED
          - VOID
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseTransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
    post:
      tags:
      - Transfers
      summary: Create a draft
      description: "Same branch = kind MOVE, other branch = kind BRANCH. A draft changes\
        \ nothing and can be edited or deleted."
      operationId: createTransfer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /transfers/{id}/send:
    post:
      tags:
      - Transfers
      summary: Send (other branch)
      description: "Stock leaves the source, earliest expiry first; lines are split\
        \ per batch. Status IN_TRANSIT."
      operationId: sendTransfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /transfers/{id}/return:
    post:
      tags:
      - Transfers
      summary: Return to sender
      description: "Instead of receiving: the same batches go back into the source\
        \ at the same cost."
      operationId: returnTransfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReturnRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /transfers/{id}/receive:
    post:
      tags:
      - Transfers
      summary: Receive at the destination
      description: Lines default to what was sent and can't be more. A shortfall becomes
        a posted "lost in transit" adjustment.
      operationId: receiveTransfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferReceiveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /transfers/{id}/move:
    post:
      tags:
      - Transfers
      summary: Move (same branch)
      description: Out of one warehouse and into the other in one transaction. Status
        MOVED.
      operationId: moveTransfer
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransferResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /suppliers:
    get:
      tags:
      - Suppliers
      summary: Search suppliers
      description: q matches name or phone.
      operationId: searchSuppliers
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 10
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          default:
          - "name,ASC"
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseSupplierResponse"
      security:
      - bearer: []
        business: []
        branch: []
    post:
      tags:
