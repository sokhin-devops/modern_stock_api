      description: "VAT, riel rounding, discount limit, negative stock, receipt footer."
      operationId: getSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
      security:
      - bearer: []
        business: []
        branch: []
    put:
      tags:
      - Business
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessSettings"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessSettings"
      security:
      - bearer: []
        business: []
        branch: []
  /business/onboarding:
    put:
      tags:
      - Business
      summary: Finish the setup page
      description: "Second step after POST /me/businesses. Creates the main branch\
        \ (with a Main warehouse), settings, today's exchange rate, starter units\
        \ and categories, and the \"Market\" supplier. Runs once."
      operationId: onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessResponse"
      security:
      - bearer: []
        business: []
        branch: []
