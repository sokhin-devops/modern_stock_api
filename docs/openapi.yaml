        description: Defaults to the selected branch
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CashShiftResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /bills:
    get:
      tags:
      - Purchases
      summary: Bills
      description: Sorted by due date. overdue is calculated from the due date.
      operationId: listBills
      parameters:
      - name: supplierId
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - UNPAID
          - PARTLY_PAID
          - PAID
          - VOID
      - name: page
        in: query
        description: Zero-based page index (0..N)
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - name: size
        in: query
        description: The size of the page to be returned
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - name: sort
        in: query
        description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        required: false
        schema:
          type: array
          items:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponseBillResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /billing:
    get:
      tags:
      - Billing
      summary: "Plan, status and usage"
      description: "effectivePlanCode is what the limits come from: PRO during the\
        \ trial, FREE after a plan ends. limit null = unlimited. Subscribing, changing\
        \ plan and the demo payment come next."
      operationId: getBilling
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /adjustments/{id}:
    get:
      tags:
      - Adjustments
      operationId: getAdjustment
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdjustmentResponse"
      security:
      - bearer: []
        business: []
        branch: []
  /members/invitations/{id}:
    delete:
      tags:
      - Members
      operationId: cancelInvitation
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: No Content
      security:
      - bearer: []
        business: []
        branch: []
components:
  schemas:
    UnitRequest:
