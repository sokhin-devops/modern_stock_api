- name: Customers
  description: Customers and what they owe
- name: Purchases
  description: "Purchase orders, receiving goods, bills, supplier payments"
- name: POS
  description: "Counter sales: checkout, sales receipts, invoices, payments received"
- name: Cash shifts
  description: Opening and closing the cash drawer in USD and KHR
- name: Stock
  description: "Stock levels, stock card, batches"
- name: Adjustments
  description: Opening stock and stock adjustments
- name: Transfers
  description: Moves inside a branch and transfers between branches
- name: Billing
  description: "Plan, limits and usage (Owner only)"
