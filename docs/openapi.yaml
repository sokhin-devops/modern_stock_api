        \ week. Super admins are left out."
      operationId: platformStats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"
      security:
      - bearer: []
  /admin/plans:
    get:
