openapi: 3.1.0
info:
  title: ModernStock API
  description: |
    REST API for **ModernStock**, a stock management system for small businesses in Cambodia.

    **How to try it**
    1. `POST /auth/login` with the demo account `owner@demo.com` / `Demo@1234` (dev profile), or sign up.
    2. Copy `accessToken`, click **Authorize**, paste it into **bearer**.
    3. `GET /me/businesses`, then put the business `id` into **business** (`X-Business-Id`).
       Optionally put a branch ID, or `all`, into **branch** (`X-Branch-Id`).

    **Conventions**
    - Money is USD with 2 decimals; riel amounts are whole numbers. Quantities are in the product's base unit
      unless a `unitId` is given.
    - Lists take `page`, `size` and `sort` (for example `sort=nameEn,asc`) and return
      `content`, `page`, `size`, `totalElements`, `totalPages`.
    - Errors are RFC 7807 `ProblemDetail` with a `code` (for example `INSUFFICIENT_STOCK`) and a message in
      the `Accept-Language` language (`km` or `en`).
    - Posted documents are never edited or deleted; they are voided or returned.
  contact:
    name: ModernStock thesis team
  version: v1
servers:
- url: /api/v1
  description: This server
tags:
- name: Auth
  description: "Sign up, log in, tokens, passwords"
- name: My account
  description: "Profile, my businesses, my invitations (no X-Business-Id)"
- name: Public
  description: Website data and invitation links (no token)
- name: Business
  description: "Business profile, setup, settings"
- name: Branches
  description: Branches and their warehouses
- name: Exchange rates
  description: Daily USD to KHR rate
- name: Members
  description: "Members, roles, invitations"
- name: Products
  description: "Products, packaging units, barcode lookup"
- name: Categories and units
  description: Catalog master data
- name: Suppliers
  description: Suppliers and what you owe them
- name: Customers
  description: Customers and what they owe
- name: Purchases
  description: "Purchase orders, receiving goods, bills, supplier payments"
- name: POS
  description: "Counter sales: checkout, sales receipts, invoices, payments received"
- name: Cash shifts
  description: Opening and closing the cash drawer in USD and KHR
- name: Stock
  description: "Stock levels, stock card, batches"
- name: Adjustments
  description: Opening stock and stock adjustments
- name: Transfers
  description: Moves inside a branch and transfers between branches
- name: Billing
  description: "Plan, limits and usage (Owner only)"
