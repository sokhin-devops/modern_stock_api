              schema:
                $ref: "#/components/schemas/BillingResponse"
      security:
      - bearer: []
        business: []
        branch: []
components:
  schemas:
    UnitRequest:
      type: object
      properties:
        nameEn:
          type: string
          maxLength: 60
          minLength: 0
        nameKm:
          type: string
          maxLength: 60
          minLength: 0
        symbol:
          type: string
          maxLength: 10
          minLength: 0
      required:
      - nameEn
      - symbol
    UnitResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nameEn:
          type: string
        nameKm:
          type: string
        symbol:
          type: string
    TransferLineRequest:
      type: object
      properties:
        productId:
          type: integer
          format: int64
        unitId:
          type: integer
          format: int64
          description: Empty = base unit
        qty:
          type: number
          minimum: 0
        batchId:
          type: integer
          format: int64
          description: Send this batch on purpose (for example expired goods); empty
            = earliest expiry first
      required:
      - productId
      - qty
    TransferRequest:
      type: object
      properties:
        fromWarehouseId:
          type: integer
          format: int64
        toWarehouseId:
          type: integer
          format: int64
          description: "A warehouse, or give toBranchId to use that branch's receiving\
            \ warehouse"
        toBranchId:
          type: integer
          format: int64
        carrierNote:
          type: string
          maxLength: 255
          minLength: 0
        note:
          type: string
          maxLength: 500
          minLength: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TransferLineRequest"
          minItems: 1
      required:
      - fromWarehouseId
      - lines
    TransferLineResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        productName:
          type: string
        unitId:
          type: integer
          format: int64
        unitSymbol:
          type: string
        qty:
          type: number
        baseQty:
          type: number
        batchId:
          type: integer
          format: int64
        batchNo:
          type: string
        expiryDate:
          type: string
          format: date
        unitCost:
          type: number
        qtyReceived:
          type: number
    TransferResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        number:
          type: string
        kind:
          type: string
          enum:
          - MOVE
          - BRANCH
        status:
          type: string
          enum:
          - DRAFT
          - MOVED
          - IN_TRANSIT
          - RECEIVED
          - RETURNED
          - VOID
        fromWarehouseId:
          type: integer
          format: int64
        fromName:
          type: string
        fromBranchId:
          type: integer
          format: int64
        toWarehouseId:
          type: integer
          format: int64
        toName:
          type: string
        toBranchId:
          type: integer
          format: int64
        sentAt:
          type: string
          format: date-time
        receivedAt:
          type: string
          format: date-time
        returnedAt:
          type: string
          format: date-time
        returnReason:
          type: string
        carrierNote:
          type: string
        note:
          type: string
        shortLines:
          type: integer
          format: int32
          description: Lines that arrived short ("Received · 1 short")
        adjustmentId:
          type: integer
          format: int64
        value:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/TransferLineResponse"
    SupplierRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 160
          minLength: 0
        contactPerson:
          type: string
          maxLength: 120
          minLength: 0
        phone:
          type: string
          pattern: "^(0|\\+855\\s?)\\d{2}\\s?\\d{3}\\s?\\d{3,4}$"
        telegram:
          type: string
          maxLength: 60
          minLength: 0
        address:
          type: string
          maxLength: 255
          minLength: 0
        vatTin:
          type: string
          maxLength: 30
          minLength: 0
        paymentTermsDays:
          type: integer
          format: int32
          minimum: 0
        openingBalance:
          type: number
          description: What you already owed when you started
          minimum: 0
        openingBalanceDate:
          type: string
          format: date
      required:
      - name
    SupplierResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        contactPerson:
          type: string
        phone:
          type: string
        telegram:
          type: string
        address:
          type: string
        vatTin:
          type: string
        paymentTermsDays:
          type: integer
          format: int32
        openingBalance:
          type: number
        openingBalanceDate:
          type: string
          format: date
        active:
          type: boolean
        balance:
          type: number
